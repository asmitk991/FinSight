services:
  # 1. Backend + Celery (Combined for Free Tier)
  - type: web
    name: finsight-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: backend/Dockerfile
    plan: free
    envVars:
      - key: REDIS_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite:///app/data/finance.db

  # 2. Frontend
  - type: web
    name: finsight-frontend
    env: docker
    dockerContext: ./frontend
    dockerfilePath: frontend/Dockerfile
    plan: free
    envVars:
      - key: VITE_API_URL
        value: https://finsight-backend.onrender.com/api
