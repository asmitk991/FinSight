services:
  # 1. Redis
  - type: redis
    name: finsight-redis
    plan: free
    ipAllowList: []

  # 2. Backend
  - type: web
    name: finsight-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: REDIS_URL
        fromRedis:
          name: finsight-redis
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite:///app/data/finance.db

  # 3. Celery Worker
  - type: worker
    name: finsight-worker
    env: docker
    dockerContext: ./backend
    dockerfilePath: Dockerfile
    plan: starter 
    dockerCommand: celery -A app.tasks worker --loglevel=info
    envVars:
      - key: REDIS_URL
        fromRedis:
          name: finsight-redis
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false

  # 4. Frontend
  - type: web
    name: finsight-frontend
    env: docker
    dockerContext: ./frontend
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: VITE_API_URL
        value: https://finsight-backend.onrender.com/api
